# config.yaml
# Paths to input files for the pipeline

# =============================================================================
# MODELS TO RUN
# =============================================================================
models:
  enformer: false
  basenji: true  # Set to true when ready to run Basenji
  alphagenome: false  # Set to true when ready to run AlphaGenome

# =============================================================================
# SHARED DATA PATHS
# =============================================================================

# Input VCF containing variants of interest
vcf: "Data/VCF/IGVFFI4134MFLL.vcf.gz"
# vcf: "Data/VCF/IGVFFI4378PZYI.vcf.gz"

# Reference genome and Enformer targets file
fasta: "Data/Genome/hg38.fa"
targets: "Data/targets_human.txt"

# Experimental MPRA data
# mpra_data: "Data/MPRA/HEPG2_reporter_variants.tsv.gz"
mpra_data: "Data/MPRA/HEK293T_reporter_variants.tsv.gz"

cell_line: "HepG2"
cell_line_column_name: "HepG2"

max_variants: "100"  # Maximum number of variants to process (for testing purposes)

# =============================================================================
# BASENJI CONFIGURATION
# =============================================================================
basenji:
  params: "Models/Basenji/basenji/manuscripts/cross2020/params_human.json"
  model: "Models/Basenji/basenji/manuscripts/cross2020/model_human.h5"
  script: "Models/Basenji/basenji/bin/basenji_sad.py"
  targets: "Models/Basenji/basenji/manuscripts/cross2020/targets_human.txt"
  rc: true
  shifts: "0"

# =============================================================================
# ALPHAGENOME CONFIGURATION
# =============================================================================
# alphagenome:
#   api_key: ""  # Replace with your actual AlphaGenome API key
#   organism: "human"  # "human" or "mouse"
#   sequence_length: "1MB"  # "2KB", "16KB", "100KB", "500KB", "1MB"
#   # Which modalities to score
#   modalities:
#     rna_seq: true
#     cage: true
#     procap: true
#     atac: true
#     dnase: true
#     chip_histone: true
#     chip_tf: true
#     polyadenylation: true
#     splice_sites: true
#     splice_site_usage: true
#     splice_junctions: true

# =============================================================================
# AGGREGATION FLAGS
# =============================================================================
# Aggregation flags (set to true to compute the corresponding aggregation during merge)
agg_global: true
agg_global_max: false
agg_global_min: false

agg_per_biosample: false
agg_per_biosample_max: false
agg_per_biosample_min: false

agg_per_assay: true
agg_per_assay_max: false
agg_per_assay_min: false

# Optional: exclude a small symmetric or asymmetric range of mean SAD values from plots
# Set to null to disable, or provide numeric values.
exclude_min:  "None"
exclude_max:  "None"

# =============================================================================
# SIGNIFICANCE THRESHOLDS FOR VISUALIZATION
# =============================================================================
# Define thresholds for marking variants as significant in plots
# PVAL and QVAL are -log10 transformed values from VCF
# Higher values = more significant
significance:
  use_significance_coloring: true  # Enable/disable significance-based coloring in plots
  
  # Which statistic to use for significance determination
  # Options: "PVAL" (p-value), "QVAL" (FDR-corrected q-value), "both" (require both)
  statistic: "QVAL"
  
  # Threshold for significance (in -log10 scale)
  # Common values:
  #   1.3 = p/q < 0.05 (-log10(0.05) ≈ 1.3)
  #   2.0 = p/q < 0.01 (-log10(0.01) = 2.0)
  #   3.0 = p/q < 0.001 (-log10(0.001) = 3.0)
  threshold: 1.3  # Default: FDR < 0.05
  
  # Optional: additional threshold for stricter significance
  # Only used if statistic is "both"
  pval_threshold: 1.3  # -log10(0.05)
  qval_threshold: 1.3  # -log10(0.05)
  
  # Plotting colors
  colors:
    significant: "#E74C3C"      # Red for significant variants
    nonsignificant: "#95A5A6"   # Gray for non-significant variants
    significant_alpha: 0.7      # Opacity for significant points
    nonsignificant_alpha: 0.3   # Opacity for non-significant points